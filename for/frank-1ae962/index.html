<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private page</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d211c;--soft:#545b51;--line:#e3e0d8;--bg:#faf8f4;--card:#fff;--olive:#5d6b48;--tint:#eef1e8;--warn:#fff3d6;--warnink:#6a4a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Inter,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:56px 22px 90px}
h1,h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;line-height:1.1;margin:0}
h1{font-size:clamp(44px,7vw,68px)}
h2{font-size:clamp(32px,5vw,44px);margin-bottom:6px}
h3{font-size:17px;margin:26px 0 8px}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--olive);font-weight:600;margin-bottom:14px}
.lede{font-size:19px;color:var(--soft);max-width:640px}
.note{background:var(--tint);border-radius:12px;padding:14px 18px;font-size:15px;color:var(--soft);margin-top:22px}
.warn{background:var(--warn);color:var(--warnink);border-radius:12px;padding:12px 16px;font-size:15px;margin-top:14px}
nav.toc{margin:34px 0 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
nav.toc a{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-size:15px}
nav.toc a span{color:var(--olive);font-weight:600;margin-right:8px}
section{margin-top:64px;padding-top:12px;border-top:1px solid var(--line)}
.num{font-size:14px;color:var(--olive);font-weight:600}
.time{font-size:14px;color:var(--soft);margin-left:10px}
audio{width:100%;margin:18px 0 6px;display:block}
.player{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:26px 0 0}
.player .label{margin-top:0}
ol,ul{padding-left:22px;margin:8px 0}
li{margin:6px 0}
.path{font-family:"JetBrains Mono",monospace;font-size:14px;background:var(--tint);padding:2px 7px;border-radius:6px;overflow-wrap:anywhere}
.copy{position:relative;margin:12px 0}
.copy pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:42px 18px 16px;font:14px/1.6 "JetBrains Mono",monospace}
.copy button{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font:600 13px Inter,sans-serif;cursor:pointer}
.label{font-size:13px;font-weight:600;color:var(--soft);margin-top:18px}
.status{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.status div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px}
.status b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);margin-bottom:3px}
.done{font-size:15px;color:var(--soft);margin-top:12px}
footer{margin-top:70px;font-size:14px;color:var(--soft)}
a{color:var(--olive)}
</style>
</head>
<body>
<div id="gate" style="max-width:420px;margin:18vh auto;padding:0 22px;text-align:center"><div class="kicker">Private page</div><h1 style="font-size:46px">Hey, welcome.</h1><p class="lede" style="margin:10px auto 22px">Enter the password Sam gave you.</p><form id="f" style="display:flex;gap:8px"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" style="flex:1;font:17px Inter,sans-serif;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff"><button style="font:600 16px Inter,sans-serif;padding:12px 18px;border:0;border-radius:10px;background:var(--olive);color:#fff;cursor:pointer">Open</button></form><p id="err" style="color:#a33;font-size:15px;min-height:22px"></p></div>
<div id="app"></div>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'').replace(/realestate$/,'');
async function open(p){const C=crypto.subtle;const k=await C.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:250000,hash:'SHA-256'},await C.importKey('raw',new TextEncoder().encode(norm(p)),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['decrypt']);

 document.querySelectorAll('.copy button').forEach(b=>b.addEventListener('click',()=>{navigator.clipboard.writeText(b.nextElementSibling.innerText).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)})}));

document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();open(document.getElementById('pw').value).catch(()=>{document.getElementById('err').textContent="That's not it. Try again."})});
