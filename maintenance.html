<style>
  :root { --paper: #f3ecdd; --paper-hi: #faf6ec; --ink: #2a1f1a; --ink-2: #544639; --ribbon: #a1171c; --ribbon-deep: #7b0f14; --rule: #cdbfa5; }

  .name { font-family: "Gloock", Georgia, serif; font-size: 21px; margin: 0 0 28px; }
  h1 { font-family: "Gloock", Georgia, serif; font-weight: 400; color: var(--ribbon-deep); font-size: clamp(38px, 5vw, 62px); line-height: 1.02; margin: 0 0 16px; }
  p { font-size: 18px; line-height: 1.6; color: var(--ink-2); margin: 0 0 14px; }
  a { color: var(--ribbon-deep); text-underline-offset: 3px; }
</style>
