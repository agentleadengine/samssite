<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="blotch"/>
      <feComponentTransfer in="blotch" result="fade"><feFuncA type="table" tableValues="0 0 .55 .95 1 1"/></feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="11" result="speck"/>
      <feComponentTransfer in="speck" result="specks"><feFuncA type="discrete" tableValues="1 1 1 1 1 1 0 1 1 1"/></feComponentTransfer>
      <feComposite in="rough" in2="fade" operator="in" result="faded"/>
      <feComposite in="faded" in2="specks" operator="in"/>
    </filter>
    <path id="top" d="M 38 120 A 82 82 0 0 1 202 120"/>
    <path id="bot" d="M 30 120 A 90 90 0 0 0 210 120"/>
  </defs>
  <g filter="url(#ink)" fill="none" stroke="#3f4b57" color="#3f4b57">
    <circle cx="120" cy="120" r="108" stroke-width="5"/>
    <circle cx="120" cy="120" r="97" stroke-width="1.8"/>
    <circle cx="120" cy="120" r="62" stroke-width="1.4"/>
    <g fill="#3f4b57" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="5">
      <text font-size="17"><textPath href="#top" startOffset="50%" text-anchor="middle">CHECKED</textPath></text>
      <text font-size="13"><textPath href="#bot" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">SAMUEL OCHOA · RECORD</textPath></text>
      <text x="120" y="118" font-size="36" text-anchor="middle" letter-spacing="1">2026</text>
      <text x="120" y="146" font-size="15" text-anchor="middle" letter-spacing="4">28 SEP</text>
      <text x="44" y="126" font-size="16" text-anchor="middle">★</text>
      <text x="196" y="126" font-size="16" text-anchor="middle">★</text>
    </g>
  </g>
</svg>
